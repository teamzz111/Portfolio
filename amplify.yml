version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Needs Node >= 20 with modern glibc: AL2023 image (nvm) or a
        # custom node:20 image (no nvm). The old AL2 image cannot run Node 20.
        - if command -v nvm >/dev/null 2>&1; then nvm install 20 && nvm use 20; fi
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
